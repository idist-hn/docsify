<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Viettel IDC Cloud Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Tài liệu hướng dẫn sử dụng dịch vụ Cloud của Viettel IDC">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="icon" href="media/favicon.ico" type="image/x-icon">
  <style>
    :root {
      --theme-color: #E30613;
    }
    .sidebar .sidebar-nav {
      line-height: 1.5em;
    }
    .app-name-link img {
      max-width: 80%;
    }
    
    /* Badge styles */
    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 5px;
      border-radius: 3px;
      margin-left: 5px;
      vertical-align: middle;
      line-height: 1;
    }
    
    .badge.new {
      background-color: #42b983;
      color: white;
    }
    
    .badge.beta {
      background-color: #ff9800;
      color: white;
    }
    
    .badge.soon {
      background-color: #9e9e9e;
      color: white;
    }
  </style>
</head>
<body>
  <div id="app">Đang tải...</div>
  <script>
    window.$docsify = {
      name: 'Viettel IDC Cloud',
      logo: 'media/viettel-idc-logo.svg',
      repo: '',
      loadSidebar: true,
      loadNavbar: true,
      coverpage: true,
      auto2top: true,
      maxLevel: 4,
      subMaxLevel: 2,
      routerMode: 'history',
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Tìm kiếm',
        noData: 'Không tìm thấy kết quả',
        depth: 6
      },
      pagination: {
        previousText: 'Trang trước',
        nextText: 'Trang sau',
      },
      copyCode: {
        buttonText: 'Sao chép',
        errorText: 'Lỗi',
        successText: 'Đã sao chép'
      },
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md',
        '/.*/_navbar.md': '/_navbar.md'
      },
      formatUpdated: '{DD}/{MM}/{YYYY}',
      notFoundPage: true,
      executeScript: true
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
